<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="/Hyperlinks.html" method="get">
      <fieldset>
        <legend><b>Registration Form</b></legend>
        <label for="u1">Username:</label>
        <input type="text" id="u1" name="uname"
          maxlength="6" placeholder="Enter Username" size="50" required>

          <br><br>
        
          <label for="p1">Password:</label>
          <input type="password" id="p1" name="password" minlength="5" autofocus>

          <br><br>

          <label for="e1">Email:</label>
          <input type="email" id="e1" name="email" value="sakshi@gmail.com" disabled>


          <br><br>
         <label for="add1">Enter Address:</label><br>
          <textarea name="address" id="add1" rows="10" cols="40">Jalandhar</textarea>
          <br><br>

          <label for="h1">Hobbies:</label>
          <input type="checkbox" name="hobby" id="cook1" value="cooking">
          <label for="cook1">Cooking</label>
          <input type="checkbox" name="hobby" id="sing1" value="sing" checked>
          <label for="sing1">Singing</label>
          <input type="checkbox" name="hobby" id="speak1" value="speak">
          <label for="speak1">Public Speaking</label>

          <br><br>
            <label for="">Course : </label>
          <input type="radio" name="c1" id="a1" value="B.Tech" checked>
          <label for="a1">B.Tech</label>
            <input type="radio" name="c1" id="a2" value="BCA">
          <label for="a2">BCA</label>
           <input type="radio" name="c1" id="a3" value="B.Sc">
          <label for="a3">B.Sc</label>

          <br><br>

          <label for="state1">Choose state:</label><br>
          <select name="state" id="state1" size="2" multiple>
            <option value="punjab" selected>Punjab</option>
            <option value="himachal">Himachal</option>
            <option value="andhra">Andhra Pradesh</option>
            <option value="rajsthan">Rajasthan</option>
          </select>
          

          <br><br>

          <label for="marks">Enter Marks:</label>
          <input type="number" id="marks" max="20" min="0" step="3">

          <label for="upload">Upload File:</label>
          <input type="file" id="upload" name="upload" accept="image/*">

          <br><br>
          <input type="date" id="date" name="date">
          
          <input type="time" id="time" name="time">


          <input type="submit" name="submit" id="submit" value="Submit Form">
          <input type="reset" id="reset">
          <input type="button" value="OK">

        
          </fieldset>
    </form>
</body>
</html>
