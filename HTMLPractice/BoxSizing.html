<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #parent{
            position: relative;
            width:800px;
            height: 500px;
            background-color: pink;
            border: 3px solid brown;
        }
        #d1{
            position: relative;
            width: 200px;
            height: 150px;
            background-color: aqua;
            border:2px solid red;
            padding: 20px;
            box-sizing: border-box;
            /* box-shadow: 10px 10px 10px 5px blue; */
            left:50px;
            top:30px;
            z-index: 3;
            /* transition: 5s transform; */
            animation: move 3s infinite alternate;
        }

        @keyframes move {
            from{
                transform: scale(0);
            }
            to{
                transform: scale(1);
            }
            
        }

        #d1:hover{
            /* transform: rotate(60deg); */
            /* transform: skew(40deg); */
            transform:scale(2);
        }
        /* #d2{
            position: absolute;
            width: 200px;
            height: 150px;
            background-color: yellowgreen;
            border:2px solid blue;
            padding: 20px;
            box-sizing: border-box;
            left:100px;
            top:100px;
            z-index: 2;

        } */
    </style>
</head>
<body>
    <div id="parent">
    <div id="d1">This is div section</div>
    <!-- <div id="d2">This is 2nd div</div> -->
    </div>
</body>
</html>
