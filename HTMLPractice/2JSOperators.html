    <script>
        //Arithmetic Operators

        let a = 60;
        let b =90;
        console.log(a+b, a-b, a*b, a/b, a%b, a++, ++a, a--, --a);

        let x = 10;
        let y = x++;
        console.log(x);
        console.log(y);

        //Assignment Operators

        let q = 10;
        let r= 20;
        console.log(q+=r,q-=r,q*=r);

        let w = 10;
        let s = "10";
        console.log(w!==s,w>=s);

        //Logical Operators

        let q1 = 3;
        let q2 = 3;
        console.log(!((q1>q2) || (q1==q2)));

        //Branching Statements

        let m = 40;
        if (m>=90){
            console.log("Elite batch")
        }
        else if (m>=75){
            console.log("Intermediate batch")
        }
        else if (m>=60){
            console.log("regular batch")
        }
        else{
            console.log("Fail")
        }

        //Looping Statements

        for(i=3; i<=15 ; i++){
            if(i==6){
                break;
            }
            console.log(i);
        }
