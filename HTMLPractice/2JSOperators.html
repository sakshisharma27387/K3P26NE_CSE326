    <script>
        //Arithmetic Operators

        let a = 60;
        let b =90;
        console.log(a+b, a-b, a*b, a/b, a%b, a++, ++a, a--, --a);

        let x = 10;
        let y = x++;
        console.log(x);
        console.log(y);

        //Assignment Operators

        let q = 10;
        let r= 20;
        console.log(q+=r,q-=r,q*=r);

        let w = 10;
        let s = "10";
        console.log(w!==s,w>=s);
